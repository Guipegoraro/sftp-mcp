[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sftp-mcp"
version = "0.1.0"
description = "MCP server de acesso ao SFTP do TCloud, da TOTVS: leitura livre, escrita com aprovacao do usuario"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Guilherme Pegoraro" }]
keywords = ["mcp", "sftp", "claude"]
dependencies = [
    "mcp>=1.27,<2",
    "asyncssh>=2.24",
    "keyring>=25.0",
    "tomli-w>=1.0",
]

[project.optional-dependencies]
teste = ["pytest>=8", "pytest-asyncio>=0.24"]

[project.scripts]
sftp-mcp = "sftp_mcp.server:main"
sftp-mcp-setup = "sftp_mcp.setup:main"

[tool.setuptools.packages.find]
include = ["sftp_mcp*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
